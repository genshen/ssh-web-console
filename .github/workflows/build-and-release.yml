# on:
#   push:
    # tags:
    #   - 'v*'
on: [push]

name: Build&Release

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # react-scripts 4 in the web submodule does not build on Node >= 17
          node-version: '16.x'

      - name: Build static
        run: cd web && yarn && yarn build && cd ../

      - name: Get Go dependencies
        run: go mod download

      - name: Embed static files
        # main.go embeds ./build with go:embed
        run: cp -r web/build build

      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ssh-web-console-*

  release:
    name: On Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - run: ls -R

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ssh-web-console-linux-amd64
            ssh-web-console-linux-arm64
            ssh-web-console-darwin-amd64
            ssh-web-console-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
